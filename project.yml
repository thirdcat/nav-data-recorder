# XcodeGen spec. The .xcodeproj is NOT committed — it is generated from this
# file, both in CI (see codemagic.yaml) and locally via `xcodegen generate`.
name: NavDataRecorder

options:
  bundleIdPrefix: com.thirdcat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Keep strict concurrency off: this target is deliberately written against
    # the classic GCD model (serial queues, not actors) and Swift 6 checking
    # would reject it wholesale.
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  NavDataRecorder:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thirdcat.navdatarecorder
        PRODUCT_NAME: NavDataRecorder
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # iPhone only. ARKit + LiDAR capture has no meaning on iPad here and
        # none at all in the simulator.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  NavDataRecorder:
    build:
      targets:
        NavDataRecorder: all
    run:
      config: Debug
    archive:
      config: Release
